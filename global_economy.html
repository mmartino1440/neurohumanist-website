<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- This meta tag tells search engines not to list this page in their results -->
    <meta name="robots" content="noindex">
    
    <title>Global Supply Chain Visualization | The Neuro-Humanist</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel to transpile JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* A little extra CSS for the connecting lines */
        .line {
            stroke-width: 2;
            transition: stroke 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950">

    <!-- The root element where our React app will be mounted -->
    <div id="root"></div>

    <!-- The React component and the script to render it -->
    <script type="text/babel">

        // Helper components for icons (replicating lucide-react with SVG)
        const Globe = () => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>);
        const Smartphone = () => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>);
        const Car = () => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 16H9m10 0h1.12a1 1 0 0 0 .96-1.26l-1.7-5.1A2 2 0 0 0 17.5 8H6.5a2 2 0 0 0-1.88 1.64l-1.7 5.1A1 1 0 0 0 4 16h1m0 0H3m16 0h.01M6 16v4m12-4v4m-6-4v4"></path></svg>);
        const Cpu = () => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>);
        const Box = () => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>);

        // The main React Component for the visualization
        const GlobalSupplyChain = () => {
          const [activePath, setActivePath] = React.useState('smartphone');

          const paths = {
            smartphone: ['raw-materials', 'specialized-manufacturing-sp', 'final-assembly-sp', 'finished-product-sp'],
            automobile: ['raw-materials', 'specialized-manufacturing-car', 'final-assembly-car', 'finished-product-car'],
          };

          const nodes = {
            'raw-materials': { x: 10, y: 50, label: 'Raw Materials', desc: 'Minerals, Silicon, Lithium, Rubber', Icon: Globe, active: true },
            'specialized-manufacturing-sp': { x: 40, y: 30, label: 'Specialized Mfg.', desc: 'Microchips, Displays', Icon: Cpu },
            'final-assembly-sp': { x: 70, y: 30, label: 'Final Assembly', desc: 'Foxconn, etc.', Icon: Box },
            'finished-product-sp': { x: 90, y: 30, label: 'Smartphone', desc: 'Consumer Product', Icon: Smartphone },
            'specialized-manufacturing-car': { x: 40, y: 70, label: 'Specialized Mfg.', desc: 'Electronics, Engines', Icon: Cpu },
            'final-assembly-car': { x: 70, y: 70, label: 'Final Assembly', desc: 'Factories', Icon: Box },
            'finished-product-car': { x: 90, y: 70, label: 'Automobile', desc: 'Consumer Product', Icon: Car },
          };

          const createLine = (startNode, endNode) => {
            const isActive = paths[activePath].includes(startNode) && paths[activePath].includes(endNode);
            return (
              <line
                key={`${startNode}-${endNode}`}
                x1={`${nodes[startNode].x}%`}
                y1={`${nodes[startNode].y}%`}
                x2={`${nodes[endNode].x}%`}
                y2={`${nodes[endNode].y}%`}
                className={`line ${isActive ? 'stroke-cyan-400' : 'stroke-slate-600'}`}
              />
            );
          };

          return (
            <div className="w-full h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 text-white p-4 sm:p-6 overflow-auto font-sans">
              <div className="text-center mb-6">
                <h1 className="text-2xl sm:text-3xl font-bold text-cyan-400 mb-2">The Illusion of Independence</h1>
                <p className="text-sm sm:text-base text-slate-400">An Interactive Global Supply Chain</p>
              </div>

              <div className="flex justify-center space-x-4 mb-8">
                <button onClick={() => setActivePath('smartphone')} className={`px-4 py-2 rounded-lg text-sm transition ${activePath === 'smartphone' ? 'bg-cyan-500 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}>
                  Smartphone
                </button>
                <button onClick={() => setActivePath('automobile')} className={`px-4 py-2 rounded-lg text-sm transition ${activePath === 'automobile' ? 'bg-cyan-500 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}>
                  Automobile
                </button>
              </div>

              <div className="relative w-full h-3/4">
                <svg width="100%" height="100%" className="absolute top-0 left-0">
                  {createLine('raw-materials', 'specialized-manufacturing-sp')}
                  {createLine('specialized-manufacturing-sp', 'final-assembly-sp')}
                  {createLine('final-assembly-sp', 'finished-product-sp')}
                  {createLine('raw-materials', 'specialized-manufacturing-car')}
                  {createLine('specialized-manufacturing-car', 'final-assembly-car')}
                  {createLine('final-assembly-car', 'finished-product-car')}
                </svg>

                {Object.entries(nodes).map(([key, { x, y, label, desc, Icon }]) => {
                  const isActive = paths[activePath].includes(key) || key === 'raw-materials';
                  return (
                    <div
                      key={key}
                      className={`absolute p-3 sm:p-4 rounded-xl flex flex-col items-center text-center transition-all duration-300 ${isActive ? 'bg-slate-800 border border-cyan-500' : 'bg-slate-800 border border-slate-700 opacity-50'}`}
                      style={{ left: `${x}%`, top: `${y}%`, transform: 'translate(-50%, -50%)', minWidth: '100px' }}
                    >
                      <div className={`mb-2 ${isActive ? 'text-cyan-400' : 'text-slate-500'}`}><Icon /></div>
                      <h3 className="text-xs sm:text-sm font-bold text-white">{label}</h3>
                      <p className="text-xs text-slate-400 hidden sm:block">{desc}</p>
                    </div>
                  );
                })}
              </div>
                <div className="text-center text-xs text-slate-500 mt-8">
                    <p>This visualization illustrates the core argument from the essay "The Illusion of Independence."</p>
                    <p>Click the buttons to trace the complex, specialized path from raw materials to a finished product.</p>
                </div>
            </div>
          );
        };

        // Find the root DOM element and render our React component into it.
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<GlobalSupplyChain />);

    </script>

</body>
</html>
